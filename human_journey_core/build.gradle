plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.3'
}

group = 'org.humanjourney'
version = mod_version
base.archivesName = 'human_journey_core'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        register('server') {
            workingDir = layout.buildDirectory.dir('safety-server')
            systemProperty 'humanjourney.safetyServer', 'true'
            systemProperty 'humanjourney.safetyPhase', providers.gradleProperty('safetyPhase').getOrElse('verify')
            args '--nogui', '--mixin', 'human_journey_core.water.mixins.json', '--mixin', 'human_journey_core.fishing.mixins.json', '--mixin', 'human_journey_core.economy.mixins.json', '--mixin', 'human_journey_core.juice.mixins.json', '--mixin', 'human_journey_core.xaero.mixins.json', '--mixin', 'human_journey_core.advancements.mixins.json', '--mixin', 'human_journey_core.wrap.mixins.json'
        }
        register('data') {
            workingDir = layout.buildDirectory.dir('datagen-smoke')
            systemProperty 'humanjourney.waterSmoke', 'true'
            args '--mixin', 'human_journey_core.water.mixins.json', '--mixin', 'human_journey_core.fishing.mixins.json', '--mixin', 'human_journey_core.economy.mixins.json', '--mixin', 'human_journey_core.juice.mixins.json', '--mixin', 'human_journey_core.xaero.mixins.json', '--mixin', 'human_journey_core.advancements.mixins.json', '--mixin', 'human_journey_core.advancements-smoke.mixins.json', '--mixin', 'human_journey_core.wrap.mixins.json', '--mod', 'human_journey_core', '--all', '--output', layout.buildDirectory.dir('datagen-smoke-output').get().asFile.absolutePath
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Public distribution; never use the user's installed mods/ as a classpath.
    // Exact bytes match installed TAN 21.8.0.2 (see docs/API-EVIDENCE.md).
    compileOnly 'curse.maven:tough-as-nails-246391:7063978'
    compileOnly 'com.github.glitchfiend:GlitchCore-forge:1.21.8-21.8.0.0'
    runtimeOnly 'curse.maven:tough-as-nails-246391:7063978'
    runtimeOnly 'com.github.glitchfiend:GlitchCore-forge:1.21.8-21.8.0.0'
    testCompileOnly 'curse.maven:tough-as-nails-246391:7063978'
    testCompileOnly 'com.github.glitchfiend:GlitchCore-forge:1.21.8-21.8.0.0'
    testRuntimeOnly 'curse.maven:tough-as-nails-246391:7063978'
    testRuntimeOnly 'com.github.glitchfiend:GlitchCore-forge:1.21.8-21.8.0.0'
    compileOnly 'curse.maven:xaeros-world-map-317780:6786823'
    testCompileOnly 'curse.maven:xaeros-world-map-317780:6786823'
    testRuntimeOnly 'curse.maven:xaeros-world-map-317780:6786823'
    compileOnly 'curse.maven:easy-npc-core-1308987:7402995'
    runtimeOnly 'curse.maven:easy-npc-core-1308987:7402995'
    testRuntimeOnly 'curse.maven:easy-npc-core-1308987:7402995'
    compileOnly 'com.github.glitchfiend:SereneSeasons-forge:1.21.8-21.8.0.0'
    runtimeOnly 'com.github.glitchfiend:SereneSeasons-forge:1.21.8-21.8.0.0'
    testRuntimeOnly 'com.github.glitchfiend:SereneSeasons-forge:1.21.8-21.8.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
    systemProperty 'java.io.tmpdir', file('.tmp').absolutePath
    systemProperty 'user.home', file('.java-user-home').absolutePath
    systemProperty 'humanjourney.projectDir', projectDir.absolutePath
    workingDir = layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs(); file('.tmp').mkdirs(); file('.java-user-home').mkdirs() }
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('Implementation-Version': project.version)
}
tasks.named('jar') { manifest.attributes('MixinConfigs': 'human_journey_core.water.mixins.json,human_journey_core.fishing.mixins.json,human_journey_core.economy.mixins.json,human_journey_core.juice.mixins.json,human_journey_core.xaero.mixins.json,human_journey_core.advancements.mixins.json,human_journey_core.wrap.mixins.json') }
tasks.named('processResources') {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
}

// Check the packaged runtime JAR, not only the source resource directory.
def runtimeJar = tasks.named('jar', Jar)
tasks.register('verifyJarMetadata') {
    group = 'verification'
    description = 'Validate Minecraft 1.21.8 pack metadata at the runtime JAR root.'
    dependsOn runtimeJar
    inputs.file(runtimeJar.flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(runtimeJar.get().archiveFile.get().asFile).withCloseable { zip ->
            def entry = zip.getEntry('pack.mcmeta')
            if (entry == null || entry.directory) {
                throw new GradleException('Runtime JAR is missing root pack.mcmeta')
            }
            def metadata = new groovy.json.JsonSlurper().parseText(
                zip.getInputStream(entry).getText('UTF-8'))
            if (metadata.pack?.pack_format != 64 ||
                    metadata.pack?.description != 'Human Journey Core') {
                throw new GradleException('Invalid Minecraft 1.21.8 resource-pack metadata')
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyJarMetadata') }

// The isolated validation harness is present in dev runs, never in the installed mod.
tasks.named('jar') { exclude 'org/humanjourney/core/wrap/safety/SafetyServerValidation*' }
tasks.register('prepareSafetyServer') {
    doLast {
        def runDir = layout.buildDirectory.dir('safety-server').get().asFile
        runDir.mkdirs()
        new File(runDir, 'eula.txt').text = 'eula=true\n'
        new File(runDir, 'server.properties').text = 'online-mode=false\nserver-port=0\nview-distance=2\nsimulation-distance=2\nlevel-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","lakes":false,"features":false}\ngenerate-structures=false\nspawn-protection=0\nmax-tick-time=120000\nlevel-name=isolated-earth-fixture\nlevel-seed=1\n'
    }
}
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'prepareSafetyServer' }

tasks.register('enableSafetyFixture') {
    doLast {
        def fixture = layout.buildDirectory.dir('safety-server/isolated-earth-fixture/serverconfig').get().asFile
        if (!layout.buildDirectory.file('safety-server/PREPARED.txt').get().asFile.exists()) throw new GradleException('Isolated fixture not prepared')
        fixture.mkdirs()
        new File(fixture, 'human_journey_core-world-wrap.toml').text = '[world_wrap]\nenabled=true\nlog_crossings=true\narrival_inset_blocks=32\n[earth_protection]\nenabled=true\n'
    }
}

