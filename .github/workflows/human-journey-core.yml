name: Build Human Journey Core
on:
  push:
    paths:
      - 'human_journey_core/**'
      - '.github/workflows/human-journey-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human_journey_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test build runData
          grep -R 'WATER_MIXIN_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'WATER_STATE_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'SALT_PURIFIER_SMOKE_OK' build/datagen-smoke/logs/latest.log
      - uses: actions/upload-artifact@v4
        with:
          name: HumanJourneyCore-0.4.1
          if-no-files-found: error
          path: |
            human_journey_core/build/libs/*.jar
            human_journey_core/build/reports/tests/test/**
            human_journey_core/build/datagen-smoke/logs/latest.log
