name: Build Human Journey Core
on:
  push:
    paths:
      - 'human_journey_core/**'
      - '.github/workflows/human-journey-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human_journey_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test build runData
          grep -R 'WATER_MIXIN_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'WATER_STATE_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'SALT_PURIFIER_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'NPC_TEMPLATE_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'NPC_CONTEXT_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'FISHING_MIXIN_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'NPC_ECONOMY_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'NPC_DIVERSITY_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'GEOGRAPHY_DISCOVERY_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'JUICE_CANTEEN_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'JUICE_SCALING_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'MAP_GEOMETRY_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'MAP_FEATURE_SMOKE_OK' build/datagen-smoke/logs/latest.log
          grep -R 'MAP_GEOMETRY_V2_SMOKE_OK' build/datagen-smoke/logs/latest.log
      - name: Check out exact 0.14.1 benchmark reference
        uses: actions/checkout@v4
        with:
          ref: df297f47da828ee40ca8796bd00a028a637db461
          path: baseline-0141
      - name: Compare identical synthetic benchmark against exact 0.14.1
        working-directory: baseline-0141/human_journey_core
        run: |
          cp ../../human_journey_core/src/test/java/org/humanjourney/core/mapfeature/GeometryCapacityBenchmarkTest.java src/test/java/org/humanjourney/core/mapfeature/
          chmod +x gradlew
          ./gradlew --no-daemon test --tests org.humanjourney.core.mapfeature.GeometryCapacityBenchmarkTest
          cp build/reports/map-feature-capacity-benchmark.json ../../human_journey_core/build/reports/map-feature-capacity-benchmark-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: HumanJourneyCore-0.14.2
          if-no-files-found: error
          path: |
            human_journey_core/build/libs/*.jar
            human_journey_core/build/reports/tests/test/**
            human_journey_core/build/reports/map-feature-capacity-benchmark*.json
            human_journey_core/build/datagen-smoke/logs/latest.log
